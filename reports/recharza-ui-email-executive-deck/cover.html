<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recharza Platform</title>
<style>
*{box-sizing:border-box} body{margin:0}
.slide-container{width:1280px;min-height:720px;background:#0b0b12;color:#f8fafc;font-family:Arial,"Helvetica Neue",sans-serif;position:relative;overflow:hidden;padding:72px 82px 0}
.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:54px;min-height:639px;align-items:center}
.eyebrow{font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#a78bfa;margin-bottom:25px;font-weight:700}
h1{font-size:70px;line-height:1.02;letter-spacing:-3px;margin:0 0 25px;max-width:690px;font-weight:800}
.subtitle{font-size:26px;line-height:1.35;color:#cbd5e1;max-width:620px;margin:0 0 34px}
.meta{font-size:14px;letter-spacing:1.2px;color:#64748b;text-transform:uppercase;border-top:1px solid #3b2356;padding-top:17px;max-width:580px}
.visual{border-left:1px solid #5b21b6;padding-left:28px;display:flex;align-items:center;min-height:360px;position:relative}
.visual:before{content:"";position:absolute;left:-1px;top:32px;width:1px;height:260px;background:#22d3ee}
.visual img{width:520px;height:250px;object-fit:contain;opacity:.86;filter:saturate(1.15) contrast(1.08)}
.accent{position:absolute;right:0;top:0;width:220px;height:220px;background:radial-gradient(circle,#7c3aed33 0%,transparent 68%)}
.line{position:absolute;left:82px;right:82px;bottom:34px;height:1px;background:linear-gradient(90deg,#8b5cf6, #22d3ee 45%, transparent)}
</style>
</head>
<body>
<div class="slide-container">
<div class="accent"></div>
<div class="grid">
<section>
<div class="eyebrow">Executive review · 2026</div>
<h1>Recharza<br/>Platform</h1>
<p class="subtitle">UI &amp; Transactional Email Styling Transformation</p>
<p class="meta">Premium storefront · responsive workspaces · branded customer communications</p>
</section>
<section class="visual"><img src="/home/ubuntu/recharza-platform/reports/recharza-style-system-map.png" alt="Recharza visual system map" /></section>
</div>
<div class="line"></div>
</div>
</body>
</html>
