name: Deploy to Vercel

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Vercel Preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Install Vercel CLI
        run: npm install --global vercel@50.1.0

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Load pulled Vercel environment
        run: |
          if [ -f .env.preview.local ]; then
            set -a
            . .env.preview.local
            set +a
          fi

      - name: Build Vercel artifact
        run: |
          env_file="$(find . .vercel -maxdepth 2 -type f \( -name '.env*.local' -o -name '.env.*' \) -print -quit 2>/dev/null || true)"
          if [ -z "$env_file" ]; then echo "No pulled Vercel environment file found"; exit 1; fi
          echo "Using pulled Vercel environment: $env_file"
          set -a
          . "$env_file"
          set +a
          SKIP_DB_MIGRATIONS=1 vercel build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy preview
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `### Vercel Preview\n\n${url}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  production:
    name: Vercel Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Install Vercel CLI
        run: npm install --global vercel@50.1.0

      - name: Pull Vercel production environment
        run: |
          mkdir -p .vercel
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel env pull .vercel/.env.production.local --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Load pulled Vercel environment
        run: |
          if [ ! -f .vercel/.env.production.local ]; then
            echo "No pulled Vercel production environment file found"
            exit 1
          fi
          set -a
          . .vercel/.env.production.local
          set +a

      - name: Build Vercel artifact
        run: |
          env_file="$(find . .vercel -maxdepth 2 -type f \( -name '.env*.local' -o -name '.env.*' \) -print -quit 2>/dev/null || true)"
          if [ -z "$env_file" ]; then echo "No pulled Vercel environment file found"; exit 1; fi
          echo "Using pulled Vercel environment: $env_file"
          set -a
          . "$env_file"
          set +a
          SKIP_DB_MIGRATIONS=1 vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Register canonical Telegram webhooks
        run: |
          if [ ! -f .vercel/.env.production.local ]; then
            echo "No pulled Vercel production environment file found"
            exit 1
          fi
          set -a
          . .vercel/.env.production.local
          set +a
          npm run support:telegram:webhook
